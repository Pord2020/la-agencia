[advisories]
unmaintained = "workspace"

[licenses]
allow = [
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  # Used by the WebPKI root-certificate dataset bundled by Tauri's TLS stack.
  # CDLA-Permissive-2.0 allows use, modification, and redistribution.
  "CDLA-Permissive-2.0",
  "ISC",
  # Required by Tauri's standards-based CSS parser stack. MPL-2.0 is
  # file-level copyleft and is compatible with distributing this MIT project.
  "MPL-2.0",
  "Unicode-3.0",
  "Zlib",
]
confidence-threshold = 0.8

[bans]
multiple-versions = "warn"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
